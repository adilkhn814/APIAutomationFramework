# Account Aggregator Test Framework Configuration
# ==============================================

# API Base URLs
base.url=https://api.account-aggregator.com
auth.url=https://auth.account-aggregator.com

# Environment Configuration
environment=TEST

# API Timeouts (in milliseconds)
timeout.connection=10000
timeout.read=30000
retry.count=3

# Database Configuration
db.enabled=false
db.pool.max.size=10
db.pool.min.idle=2
db.connection.timeout=30000
db.idle.timeout=600000
db.max.lifetime=1800000

# WireMock Configuration
wiremock.port=8089
wiremock.enabled=true

# Reporting Configuration
extent.report.path=reports/extent-report.html
extent.report.title=Account Aggregator API Test Report
extent.report.name=AA API Automation Results

# Test Data Configuration
test.data.path=src/test/resources/testdata
test.customer.id=customer@example.com
test.fiu.id=test-fiu-001
test.fip.id=test-fip-001

# Logging Configuration
log.level=INFO
log.file.path=logs/aa-test.log

# Security Configuration
encryption.enabled=true
token.expiry.buffer.minutes=5

# Performance Configuration
performance.response.threshold.ms=5000
performance.total.threshold.ms=10000

# JSON Schema Validation
schema.validation.enabled=true
schema.path=src/test/resources/schemas

# Test Execution Configuration
parallel.execution=false
thread.count=1
data.provider.parallel=false

# CI/CD Configuration
jenkins.compatible=true
build.timestamp.format=yyyy-MM-dd_HH-mm-ss

# Mock Data Configuration
mock.data.enabled=true
mock.consent.handle.prefix=mock_consent_
mock.transaction.id.prefix=TXN_TEST_

# Retry Configuration for Flaky Tests
retry.failed.tests=true
retry.max.attempts=2
retry.delay.ms=1000