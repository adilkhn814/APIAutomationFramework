# ExtentReports Configuration for Account Aggregator BDD Tests
# ==========================================================

# Report Settings
extent.reporter.spark.start=true
extent.reporter.spark.out=target/cucumber-reports/extent-spark-report.html
extent.reporter.spark.config=src/test/resources/extent-spark-config.xml

# Report Title and Name
extent.reporter.spark.documenttitle=Account Aggregator BDD Test Report
extent.reporter.spark.reportname=AA API BDD Automation Results

# Theme (standard or dark)
extent.reporter.spark.theme=standard

# Time Format
extent.reporter.spark.timeformat=MMM dd, yyyy HH:mm:ss

# Encoding
extent.reporter.spark.encoding=UTF-8

# Enable/Disable Features
extent.reporter.spark.vieworder=dashboard,test,category,exception,author,device,log

# System Information
systeminfo.Environment=TEST
systeminfo.User=BDD Test User
systeminfo.Build=1.0.0
systeminfo.AppName=Account Aggregator API

# Auto-populate system information
systeminfo.os=System.getProperty("os.name")
systeminfo.java=System.getProperty("java.version")
systeminfo.user=System.getProperty("user.name")

# Report Configuration
extent.fail.screenshot=true
extent.log.short.timestamp=true

# Custom CSS and JS
extent.reporter.spark.enable.offline=false

# Email Report Settings (optional)
extent.reporter.email.start=false
extent.reporter.email.out=target/cucumber-reports/extent-email-report.html

# JSON Report Settings
extent.reporter.json.start=false
extent.reporter.json.out=target/cucumber-reports/extent-json-report.json

# PDF Report Settings  
extent.reporter.pdf.start=false
extent.reporter.pdf.out=target/cucumber-reports/extent-pdf-report.pdf